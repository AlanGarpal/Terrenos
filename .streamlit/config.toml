[theme]
# Forzar explícitamente el modo claro en Streamlit
base = "light"

primaryColor = "#12239E"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#FFFFFF" # Corregido (tenía 5 ees/efes)
textColor = "rgba(0, 0, 0, 0.67)"

# --- Color de fondo específico para los headers del DataFrame ---
dataframeHeaderBackgroundColor = "#FFEDD5"
font = "Segoe UI"
headingFont = "Segoe UI"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"

borderColor = "#FF5100" 
showWidgetBorder = true
linkColor = "#12239E"
chartCategoricalColors = ["#FF5100", "#12239E", "#FFB000", "#00A651"]

[theme.sidebar]
backgroundColor = "#03860e"
textColor = "rgba(0, 0, 0, 0.8)"
primaryColor = "#12239E"
baseFontSize = 25
baseFontWeight = 1500

[server]
port = 8508
address = "127.0.0.1"
baseUrlPath = "club"
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
